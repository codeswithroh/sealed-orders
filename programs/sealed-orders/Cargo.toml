[package]
name = "sealed-orders"
version = "0.1.0"
description = "Sealed Orders: command your army in plain English, orders sealed in a MagicBlock Private Ephemeral Rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sealed_orders"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control", "crank"] }
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }
magicblock-magic-program-api = { version = "0.10.1", default-features = false }
